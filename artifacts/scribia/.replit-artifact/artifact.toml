kind = "web"
previewPath = "/"
title = "Scribia"
version = "1.0.0"
id = "artifacts/scribia"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18777

[services.development]
run = "pnpm --filter @workspace/scribia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scribia", "run", "build" ]
publicDir = "artifacts/scribia/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18777"
BASE_PATH = "/"
