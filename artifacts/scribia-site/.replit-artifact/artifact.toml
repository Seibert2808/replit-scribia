kind = "web"
previewPath = "/scribia-site/"
title = "Scribia Site"
version = "1.0.0"
id = "artifacts/scribia-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/scribia-site/" ]
localPort = 18778

[services.development]
run = "pnpm --filter @workspace/scribia-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scribia-site", "run", "build" ]
publicDir = "artifacts/scribia-site/dist"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18778"
BASE_PATH = "/scribia-site/"
